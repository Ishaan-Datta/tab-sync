<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Placeholder</title>

    <link href="onetab.css" rel="stylesheet" type="text/css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/extension-icon32.png"
    />

    <style>
      @font-face {
        font-family: "Open Sans";
        font-style: normal;
        font-weight: 300;
        src:
          local("Open Sans Light"),
          local("OpenSans-Light"),
          url("fonts/OpenSans-Light-webfont.woff") format("woff");
      }
      @font-face {
        font-family: "Open Sans";
        font-style: normal;
        font-weight: 400;
        src:
          local("Open Sans"),
          local("OpenSans"),
          url("fonts/OpenSans-Regular-webfont.woff") format("woff");
      }
      @font-face {
        font-family: "Open Sans";
        font-style: italic;
        font-weight: 400;
        src:
          local("Open Sans Italic"),
          local("OpenSans-Italic"),
          url("fonts/OpenSans-Italic-webfont.woff") format("woff");
      }
      @font-face {
        font-family: "Open Sans";
        font-style: normal;
        font-weight: 600;
        src:
          local("Open Sans Semibold"),
          local("OpenSans-Semibold"),
          url("fonts/OpenSans-Semibold-webfont.woff") format("woff");
      }
      @font-face {
        font-family: "Open Sans";
        font-style: normal;
        font-weight: 700;
        src:
          local("Open Sans Bold"),
          local("OpenSans-Bold"),
          url("fonts/OpenSans-Bold-webfont.woff") format("woff");
      }
    </style>

    <link href="onetab.css" rel="stylesheet" type="text/css" />

    <script src="shared/default-settings.js"></script>
    <script src="shared/storage-adapters.js"></script>
    <script src="shared/model-predicates.js"></script>
    <script src="shared/collection-helpers.js"></script>
    <script src="shared/runtime-helpers.js"></script>
    <script src="shared/search-helpers.js"></script>
    <script src="shared/dom-transition-helpers.js"></script>
    <script src="shared/text-helpers.js"></script>
    <script src="shared/url-helpers.js"></script>
    <script src="shared/import-helpers.js"></script>
    <script src="shared/bundle-prelude.js"></script>
    <script src="shared/page-common.js"></script>
    <script src="shared/base-controls.js"></script>
    <script src="shared/view-controls.js"></script>
    <script src="shared/ui-controls.js"></script>
    <script src="shared/tree-renderer.js"></script>
    <script src="shared/tree-actions.js"></script>
    <script src="shared/tree-interactions.js"></script>
    <script src="shared/import-export-controls.js"></script>
    <script src="ext-onetab-concatenated-sources-placeholder.js"></script>
  </head>

  <body>
    <div style="padding:40px">
      <div
        id="filename"
        style="font-size:32px; font-weight:400; padding-bottom: 20px"
      ></div>
      <div data-m="placeholderExplanation" style="max-width: 600px;"></div>
      <div
        data-m="allowFileAccessInstructions"
        style="max-width: 600px; margin-top: 14px"
      ></div>

      <div style="margin-top: 20px; display: flex; align-items: center">
        <input
          type="text"
          id="urlInput"
          value=""
          style="width: 640px; unicode-bidi: isolate"
        />
        <div
          class="button-outer button-default-outer"
          style="margin-inline-start:14px;"
        >
          <button
            data-m="copyToClipboard"
            class="button"
            id="copyButton"
            style="padding: 4px 14px; font-size:12px; font-weight:400"
          ></button>
        </div>
      </div>
    </div>
  </body>
</html>
